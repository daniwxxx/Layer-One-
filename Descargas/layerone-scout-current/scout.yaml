app:
  name: "LayerOne Scout"
  version: "1.0.0"

server:
  addr: ":8787"
  token: ""                       # Dejar vacío para sin autenticación
  rate_limit: 120                 # requests por minuto por IP
  read_timeout: "10s"
  write_timeout: "10s"
  idle_timeout: "30s"

fetcher:
  timeout: "15s"
  user_agent: "LayerOneScout/1.0 (+analytics; public-profile-scraper)"
  max_retries: 3
  backoff_base: "2s"
  max_body_bytes: 1048576         # 1MB

storage:
  path: "profiles.json"
  backup_dir: "backups"

log:
  level: "info"                   # debug, info, warn, error
  format: "text"                  # text o json
